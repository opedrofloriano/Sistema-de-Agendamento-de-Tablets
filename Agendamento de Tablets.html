<!-- Mostra na tela qualquer erro de carregamento (para facilitar o suporte) -->
<script>
  var jaMostrou = false;

    if (jaMostrou) return;   // mostra só o primeiro erro (a causa real)
    jaMostrou = true;
    var r = document.getElementById("root");
    r.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box">' +
      '<div style="background:#131315;border:1px solid rgba(225,6,0,.4);border-radius:16px;padding:24px;max-width:520px;font-family:Arial,sans-serif">' +
      '<div style="color:#E10600;font-size:12px;letter-spacing:1.2px;text-transform:uppercase">Erro ao abrir</div>' +
      '<div style="color:#F5F5F5;font-size:20px;margin:8px 0">O sistema não conseguiu carregar.</div>' +
      '<div style="color:#A1A1AA;font-size:14px;line-height:1.5;word-break:break-word">' + msg + '</div></div></div>';
  }
  window.addEventListener("error", function (e) {
    var t = e.target;
    if (t && t.tagName === "SCRIPT") mostrarErro("Não foi possível baixar: " + t.src + "<br><br>Verifique a internet ou se a rede da escola bloqueia esse endereço.");
    else if (e.message) mostrarErro(e.message);
  }, true);
</script>
